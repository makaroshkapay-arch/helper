<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>P2P Myjot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <header>
    <div class="top-title">P2P Myjot <span>⋮</span><b>×</b></div>
  </header>

  <section class="brand">
    <div class="logo">📊</div>
    <div><strong>P2P Myjot</strong><small>Калькулятор арбитража</small></div>
    <div id="status" class="status">⏳ Проверка</div>
  </section>

  <main id="content"></main>

  <nav>
    <button data-page="calc">🔄<small>Расчёт</small></button>
    <button data-page="guarantee">🛡<small>Гарант</small></button>
    <button data-page="stats">📊<small>Статистика</small></button>
    <button data-page="goal">🎯<small>Цели</small></button>
    <button data-page="links">🔗<small>Связки</small></button><button data-page="nft">💎<small>NFT</small></button>
    <button data-page="history">🕘<small>История</small></button><button data-page="rates">💱<small>Курс</small></button>
    <button data-page="exchange">💱<small>Обмен</small></button>
  </nav>
  <footer>@helperP2PassistantBot</footer>
</div>
<script src="/app.js"></script>
</body>
</html>
